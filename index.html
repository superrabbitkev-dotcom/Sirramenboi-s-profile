<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAQLIV | Profile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="home-theme">
    <div class="custom-cursor"></div>
    <div class="glitch-overlay"></div>

    <video id="background" autoplay muted loop src="assets/background.mp4"></video>
    <div id="hacker-overlay" class="hidden"></div>
    <div id="snow-overlay" class="hidden"></div>

    <div id="results-button-container">
        <button id="results-theme">View Results</button>
        <p id="results-hint" class="hidden">Click again to return to profile</p>
    </div>

    <div id="profile-block" class="glass-panel">
        <div class="profile-container">
            <img src="assets/profile.png" class="profile-picture" alt="Profile">
        </div>
        <h1 id="profile-name" class="name-gradient"></h1>
        
        <div class="badge-group">
            <div class="badge-container"><img src="assets/staff.png" class="badge"></div>
            <div class="badge-container"><img src="assets/owner.png" class="badge"></div>
            <div class="badge-container"><img src="assets/partner.png" class="badge"></div>
            <div class="badge-container"><img src="assets/developer.png" class="badge"></div>
        </div>

        <p id="profile-bio"></p>

        <hr class="separator">

        <div class="social-links">
            <a href="#" class="social-icon"><img src="assets/discord.png"></a>
            <a href="#" class="social-icon"><img src="assets/github.png"></a>
            <a href="#" class="social-icon"><img src="assets/youtube.png"></a>
            <a href="#" class="social-icon"><img src="assets/tiktok.png"></a>
        </div>

        <div class="visitor-counter">
            <span id="visitor-count">0</span>
        </div>
    </div>

    <div id="skills-block" class="glass-panel hidden">
        <h2 class="skill-title">Programming Skills</h2>
        <div class="skill-item">
            <div class="skill-info"><span>Python</span><span>87%</span></div>
            <div class="progress-bg"><div id="python-bar" class="skill-bar"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>C++</span><span>75%</span></div>
            <div class="progress-bg"><div id="cpp-bar" class="skill-bar"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>C#</span><span>80%</span></div>
            <div class="progress-bg"><div id="csharp-bar" class="skill-bar"></div></div>
        </div>
    </div>

    <div class="controls">
        <button class="theme-button" id="home-theme">1</button>
        <button class="theme-button" id="hacker-theme">2</button>
        <button class="theme-button" id="rain-theme">3</button>
        <button class="theme-button" id="anime-theme">4</button>
        <button class="theme-button" id="car-theme">5</button>
    </div>

    <audio id="background-music" src="assets/music.mp3" loop></audio>
    <script src="script.js"></script>
</body>
</html>
